[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ligature"
version = "0.1.0"
description = "A GPT-style language model written from scratch in PyTorch and trained on TinyStories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "regex",
    "pyyaml",
    "tqdm",
    "matplotlib",
    "huggingface_hub",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
serve = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Notebooks are exploratory scratch work and are kept exactly as written.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
# Allow the conventional ML names B, T, C and `import torch.nn.functional as F`.
ignore = ["N806", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
